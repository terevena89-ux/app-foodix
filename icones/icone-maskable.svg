       Version « maskable » : dessin rapproché du centre, pour qu'Android ne coupe rien. -->

  <defs>

    <linearGradient id="degrade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#69b07e"/><stop offset="1" stop-color="#3b9155"/></linearGradient>

    <clipPath id="cadre"><rect width="100" height="100"/></clipPath>

  </defs>

  <g clip-path="url(#cadre)">

    <rect width="100" height="100" fill="url(#degrade)"/>

    <circle cx="64" cy="38" r="40" fill="#88c099" opacity=".55"/>

    <g transform="translate(-8 2) scale(1.1)"><path d="M26 48a8 8 0 0 1 14-6 8 8 0 0 1 14 0 8 8 0 0 1 14 6z" fill="#26304F"/><path d="M18 48h60a30 27 0 0 1-60 0z" fill="#FFF6E6"/><path d="M38 82h20M36 33c-4-4 4-8 0-13M50 33c-4-4 4-8 0-13M64 33c-4-4 4-8 0-13" fill="none" stroke="#FFF6E6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>

    <path d="M68 0h12v30l-6-5-6 5z" fill="#000" opacity=".2" transform="translate(1.5 1.5)"/>

    <path d="M68 0h12v30l-6-5-6 5z" fill="#FFF6E6"/>

